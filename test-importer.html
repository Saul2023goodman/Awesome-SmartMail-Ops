<!doctype html><meta charset="utf-8"><script src="importer.js"></script><pre id="out">RUNNING</pre><script>
(async()=>{
  try {
    const res=await fetch('test-sample.xlsx');
    const blob=await res.blob();
    const file=new File([blob], 'test-sample.xlsx');
    const wb=await NMDAImporter.parseFile(file);
    const best=NMDAImporter.detectBestSheet(wb.sheets);
    const payload={sheetNames:wb.sheets.map(s=>s.name),bestIndex:best.index,headerIndex:best.detection.index,mapping:best.detection.mapping,rows:wb.sheets[best.index].rows.slice(0,4)};
    document.querySelector('#out').textContent='PASS '+JSON.stringify(payload);
  } catch(e){document.querySelector('#out').textContent='FAIL '+e.stack;}
})();
</script>
