<!doctype html><meta charset="utf-8"><title>NMDA v0.5 regression</title>
<script>
const store = {};
globalThis.chrome = {
  storage: { local: {
    async get(key){ if (typeof key === 'string') return { [key]: store[key] }; return {}; },
    async set(obj){ Object.assign(store, obj); }
  }},
  runtime: { async sendMessage(msg){
    if (msg?.type === 'NMDA_ACCOUNT_INFO') return {ok:true,uid:'test@example.com'};
    return {ok:false,reason:'test stub'};
  }}
};
</script>
