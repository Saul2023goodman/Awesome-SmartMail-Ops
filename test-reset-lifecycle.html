<!doctype html><html><head><meta charset="utf-8"><title>pending</title>
<link rel="stylesheet" href="content.css">
<script>
window.chrome={
  storage:{local:{_d:{}, async get(k){ if(typeof k==='string') return {[k]:this._d[k]}; return {...this._d};}, async set(v){Object.assign(this._d,v);}}},
  runtime:{async sendMessage(){return {ok:false};}}
};
</script>
<script src="import-core.js"></script><script src="mail-recognizer.js"></script><script src="import-adapters.js"></script><script src="importer.js"></script><script src="contacts.js"></script><script src="content.js"></script>
</head><body><pre id="test-output">running</pre><script>
(async()=>{
 const out=[]; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const input=document.getElementById('nmda-import-file');
 const reset=document.getElementById('nmda-reset-import');
 const result=document.getElementById('nmda-ingest-result-card');
 const status=document.getElementById('nmda-import-status');
 const synthetic=file=>({format:'delimited',sourceFiles:[file],recordSets:[{name:'Mail',source:file.name,rows:[['收件人','主题','正文'],['a@example.com','Hello','Dear A,\nBody\nYours sincerely']],meta:{format:'delimited',preferred:true}}],embeddedFiles:[],warnings:[]});
 const original=NMDAImporter.parseFile;
 // stale async result must never revive a cleared batch
 NMDAImporter.parseFile=async file=>{await sleep(450); return synthetic(file);};
 let dt=new DataTransfer(); dt.items.add(new File(['x'],'slow.csv',{type:'text/csv'})); input.files=dt.files; input.dispatchEvent(new Event('change',{bubbles:true}));
 await sleep(60); reset.click(); await sleep(650);
 out.push(['stale-result-stays-cleared', result.hidden===true && /彻底清空/.test(status.textContent)]);
 // normal import -> visible -> reset -> clean
 NMDAImporter.parseFile=async file=>synthetic(file);
 dt=new DataTransfer(); dt.items.add(new File(['x'],'fast.csv',{type:'text/csv'})); input.files=dt.files; input.dispatchEvent(new Event('change',{bubbles:true}));
 await sleep(180);
 const loaded=!result.hidden && document.getElementById('nmda-import-preview-summary').textContent.includes('1');
 reset.click(); await sleep(40);
 const clean=result.hidden && document.getElementById('nmda-import-preview-summary').textContent.trim()==='' && document.getElementById('nmda-batch-empty').hidden===false && reset.hidden===true;
 out.push(['normal-reset-cleans-ui',loaded&&clean]);
 NMDAImporter.parseFile=original;
 const ok=out.every(x=>x[1]); document.getElementById('test-output').textContent=JSON.stringify(out); document.title=ok?'PASS':'FAIL'; document.body.dataset.test=ok?'pass':'fail';
})();
</script></body></html>
