<!doctype html><meta charset="utf-8"><title>Roster regression</title><pre id="out">RUNNING</pre>
<script src="scheduler.js"></script><script src="roster.js"></script>
<script>
const ds={sheets:[
 {name:'说明',rows:[['使用说明'],['这里不是导师名单']]},
 {name:'总名单',source:'master.csv',rows:[['序号','学校','导师姓名','邮箱','批次','状态'],[1,'University of Queensland','Monica Chien','m.chien@uq.edu.au','第一批','待联系'],[2,'University of Queensland','Josephine Previte','j.previte@business.uq.edu.au','第二批','候选'],[3,'Monash University','Stephan Ludwig','Stephan.Ludwig@monash.edu','第一批','待联系']]}
]};
const parsed=NMDARoster.parseDataset(ds);
const tasks=[
 {editKey:'a',id:'Monica Chien',recipients:'m.chien@uq.edu.au',school:''},
 {editKey:'b',id:'Stephan Ludwig',recipients:'',school:'Monash University'}
];
const audit=NMDARoster.crossCheck(tasks,parsed.entries);
const ok=parsed.entries.length===3 && audit.summary.matched===2 && audit.summary.unwritten===1 && audit.summary.schoolSupplements===1 && audit.summary.emailCandidates===1;
document.querySelector('#out').textContent=(ok?'PASS':'FAIL')+'\n'+JSON.stringify({parsed:parsed.stats,audit:audit.summary,matches:audit.matches.map(m=>({id:m.task.id,status:m.status,by:m.by,schoolSupplement:m.schoolSupplement,emailCandidate:m.emailCandidate}))},null,2);
</script>
